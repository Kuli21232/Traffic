name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ── Android SDK (pre-installed on ubuntu-latest) ───────────────────────
      - name: Verify Android SDK
        run: echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # ── Generate gradle wrapper jar (not committed) ────────────────────────
      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x gradlew

      # ── write local.properties ─────────────────────────────────────────────
      - name: Create local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ── build ──────────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── upload artifact ────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalBypass-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── print download hint ────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ APK ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download **LocalBypass-debug** from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**How to use:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Install APK on phone (enable *Unknown sources*)" >> $GITHUB_STEP_SUMMARY
          echo "2. Open app, pick strategy & port, tap **START**" >> $GITHUB_STEP_SUMMARY
          echo "3. Go to Wi-Fi settings → Proxy → Manual → \`127.0.0.1\` : \`<port>\`" >> $GITHUB_STEP_SUMMARY
